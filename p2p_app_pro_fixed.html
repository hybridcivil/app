<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P File Sharing</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
:root{--bg:#0b1220;--card:#121b2d;--card2:#18243a;--text:#f4f7fb;--muted:#91a0b8;--primary:#4f8cff;--success:#25c77a;--danger:#ff5c70;--border:#263651}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#172746 0,#0b1220 52%,#070c15 100%);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);padding:18px}
.container{width:min(100%,520px);margin:auto;background:rgba(18,27,45,.96);border:1px solid var(--border);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.4);overflow:hidden}
.appbar{padding:22px 22px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px}
.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#4f8cff,#6f5cff);display:grid;place-items:center;font-size:24px;box-shadow:0 8px 24px rgba(79,140,255,.3)}
.app-title{font-size:21px;font-weight:800;margin:0}.subtitle{font-size:12px;color:var(--muted);margin-top:3px}
.content{padding:18px}.section{margin:0 0 14px;background:var(--card2);border:1px solid var(--border);border-radius:18px;padding:16px}
.section:last-child{margin-bottom:0}.section-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}.section-icon{font-size:18px}.section h3{font-size:14px;margin:0;font-weight:750}
label{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
input[type=text]{width:100%;padding:13px 14px;border:1px solid #30415f;background:#0e1728;color:var(--text);border-radius:12px;font-size:15px;outline:none}
input[type=text]:focus{border-color:#4f8cff;box-shadow:0 0 0 3px rgba(79,140,255,.12)}input[readonly]{font-weight:800;letter-spacing:3px;text-align:center;color:#75a6ff}
input[type=file]{width:100%;padding:12px;border:1px dashed #405474;background:#0e1728;color:var(--muted);border-radius:12px;font-size:13px}
.actions{display:flex;gap:9px;margin-top:10px}.actions button{flex:1}
button,#download-link{border:0;border-radius:12px;padding:12px 15px;font-size:14px;font-weight:750;cursor:pointer;transition:.2s}
button:hover,#download-link:hover{transform:translateY(-1px);filter:brightness(1.06)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}
#connect-btn{background:var(--primary);color:#fff}#disconnect-btn{background:var(--danger);color:#fff;display:none}
#send-btn{width:100%;margin-top:10px;background:var(--success);color:#06140d}.connected-peer-id{display:none;margin-top:10px;padding:10px 12px;background:rgba(37,199,122,.1);border:1px solid rgba(37,199,122,.25);border-radius:10px;color:#73e5ad;font-size:12px;font-weight:700}
#file-list{margin-top:10px;display:grid;gap:7px}#file-list div{padding:9px 11px;background:#0e1728;border-radius:9px;color:#c9d3e4;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#received-files{display:grid;gap:8px}.empty{color:var(--muted);font-size:12px;text-align:center;padding:12px}
#download-link{display:block;background:#233a61;color:#dce9ff;text-decoration:none;text-align:left;width:100%;margin:0}
.status{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-left:auto}.dot{width:8px;height:8px;border-radius:50%;background:#f0ad4e}.online .dot{background:var(--success);box-shadow:0 0 10px var(--success)}
.footer{text-align:center;color:#61718b;font-size:10px;padding:0 18px 18px}
@media(max-width:420px){body{padding:8px}.container{border-radius:20px}.content{padding:12px}.section{padding:13px}.appbar{padding:18px}.actions{flex-direction:row}}
</style>
</head>
<body>
<div class="container">
  <div class="appbar">
    <div class="logo">↔</div>
    <div><div class="app-title">P2P File Share</div><div class="subtitle">Direct device-to-device transfer</div></div>
    <div class="status" id="status"><span class="dot"></span><span>Waiting</span></div>
  </div>
  <div class="content">
    <div class="section">
      <div class="section-head"><span class="section-icon">🪪</span><h3>Your Peer ID</h3></div>
      <label>Share this ID with the other device</label>
      <input type="text" id="peer-id" readonly placeholder="Generating…">
    </div>
    <div class="section">
      <div class="section-head"><span class="section-icon">🔗</span><h3>Connect to Peer</h3></div>
      <input type="text" id="connect-peer-id" maxlength="4" inputmode="numeric" placeholder="Enter 4-digit Peer ID">
      <div class="connected-peer-id" id="connected-peer-id">● Connected to <span id="connected-id"></span></div>
      <div class="actions"><button id="connect-btn" onclick="connectToPeer()" disabled>Connect</button><button id="disconnect-btn" onclick="disconnectFromPeer()">Disconnect</button></div>
    </div>
    <div class="section">
      <div class="section-head"><span class="section-icon">📤</span><h3>Send Files</h3></div>
      <input type="file" id="file-input" multiple>
      <div id="file-list"></div>
      <button id="send-btn" onclick="sendFiles()" disabled>Send Files</button>
    </div>
    <div class="section">
      <div class="section-head"><span class="section-icon">📥</span><h3>Received Files</h3></div>
      <div id="received-files"><div class="empty" id="empty-received">No files received yet</div></div>
    </div>
  </div>
  <div class="footer">Peer-to-peer • No file upload to your server</div>
</div>
<script>
        function setAppStatus(text, online=false){ const s=document.getElementById('status'); if(s){ s.className='status'+(online?' online':''); const t=s.querySelector('span:last-child'); if(t)t.textContent=text; }}

// Generate a 4-digit random numeric ID
function generatePeerID() {
    return Math.floor(1000 + Math.random() * 9000).toString();
}

const peer = new Peer(generatePeerID());
let conn;

// Display Peer ID when connected to PeerJS Server
peer.on('open', id => {
    document.getElementById('peer-id').value = id;
    setAppStatus('Ready', true);
});
peer.on('error', err => {
    setAppStatus('Connection error', false);
});

// Show selected files in the UI
document.getElementById('file-input').addEventListener('change', function () {
    const fileList = document.getElementById('file-list');
    fileList.innerHTML = '';
    const files = this.files;
    for (let i = 0; i < files.length; i++) {
        const fileItem = document.createElement('div');
        fileItem.textContent = files[i].name;
        fileList.appendChild(fileItem);
    }
    document.getElementById('send-btn').disabled = files.length === 0;
});

// Enable/Disable Connect button based on input
document.getElementById('connect-peer-id').addEventListener('input', function () {
    const connectBtn = document.getElementById('connect-btn');
    connectBtn.disabled = this.value.length !== 4 || isNaN(this.value);
});

// Connect to a Peer
function connectToPeer(peerId = null) {
    const targetPeerId = peerId || document.getElementById("connect-peer-id").value;
    if (targetPeerId.length !== 4 || isNaN(targetPeerId)) {
        return;
    }
    conn = peer.connect(targetPeerId);
    conn.on("open", () => {
        setAppStatus("Connected", true);
        document.getElementById("connect-btn").style.display = "none";
        document.getElementById("disconnect-btn").style.display = "inline-block";
        document.getElementById("connect-peer-id").style.display = "none";
        document.getElementById("connected-peer-id").style.display = "block";
        document.getElementById("connected-id").textContent = targetPeerId;
    });
    conn.on("close", () => {
        setAppStatus("Ready", true);
        document.getElementById("connect-btn").style.display = "inline-block";
        document.getElementById("disconnect-btn").style.display = "none";
        document.getElementById("connect-peer-id").style.display = "block";
        document.getElementById("connected-peer-id").style.display = "none";
        conn = null;
    });
    conn.on("error", (err) => {
        document.getElementById("connect-btn").style.display = "inline-block";
        document.getElementById("disconnect-btn").style.display = "none";
        document.getElementById("connect-peer-id").style.display = "block";
        document.getElementById("connected-peer-id").style.display = "none";
        conn = null;
    });
    conn.on("data", data => {
        if (data.fileName && data.fileData) {
            const blob = new Blob([data.fileData]);
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = data.fileName;
            link.id = "download-link";
            link.innerText = `Download ${data.fileName}`;
            document.getElementById("received-files").appendChild(link);
        }
    });
}

// Disconnect from Peer
function disconnectFromPeer() {
    if (conn) {
        conn.close();
        document.getElementById("connect-btn").style.display = "inline-block";
        document.getElementById("disconnect-btn").style.display = "none";
        document.getElementById("connect-peer-id").style.display = "block";
        document.getElementById("connected-peer-id").style.display = "none";
        conn = null;
    }
}

// Send Multiple Files
function sendFiles() {
    const fileInput = document.getElementById("file-input");
    const files = fileInput.files;
    if (!files.length || !conn) {
        return;
    }

    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const reader = new FileReader();
        reader.readAsArrayBuffer(file);
        reader.onload = function () {
            conn.send({
                fileName: file.name,
                fileData: reader.result
            });
            if (i === files.length - 1) {
                fileInput.value = '';
                document.getElementById('file-list').innerHTML = '';
                const sendBtn = document.getElementById('send-btn');
                sendBtn.textContent = "Sent";
                sendBtn.classList.add('sent');
                sendBtn.disabled = true;
                setTimeout(() => {
                    sendBtn.textContent = "Send";
                    sendBtn.classList.remove('sent');
                    sendBtn.disabled = true;
                }, 3000);
            }
        };
    }
}

// Handle Incoming Connection
peer.on('connection', connection => {
    conn = connection;
    conn.on("open", () => {
        setAppStatus("Connected", true);
        document.getElementById("connect-btn").style.display = "none";
        document.getElementById("disconnect-btn").style.display = "inline-block";
        document.getElementById("connect-peer-id").style.display = "none";
        document.getElementById("connected-peer-id").style.display = "block";
        document.getElementById("connected-id").textContent = conn.peer;
    });
    conn.on("close", () => {
        setAppStatus("Ready", true);
        document.getElementById("connect-btn").style.display = "inline-block";
        document.getElementById("disconnect-btn").style.display = "none";
        document.getElementById("connect-peer-id").style.display = "block";
        document.getElementById("connected-peer-id").style.display = "none";
        conn = null;
    });
    conn.on("error", (err) => {
        document.getElementById("connect-btn").style.display = "inline-block";
        document.getElementById("disconnect-btn").style.display = "none";
        document.getElementById("connect-peer-id").style.display = "block";
        document.getElementById("connected-peer-id").style.display = "none";
        conn = null;
    });
    conn.on("data", data => {
        if (data.fileName && data.fileData) {
            const blob = new Blob([data.fileData]);
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = data.fileName;
            link.id = "download-link";
            link.innerText = `Download ${data.fileName}`;
            document.getElementById("received-files").appendChild(link);
        }
    });
});

// Handle Peer disconnection
peer.on('disconnected', () => {
    document.getElementById("connect-btn").style.display = "inline-block";
    document.getElementById("disconnect-btn").style.display = "none";
    document.getElementById("connect-peer-id").style.display = "block";
    document.getElementById("connected-peer-id").style.display = "none";
    conn = null;
});

        // Prevent URL display on hover
document.addEventListener('DOMContentLoaded', function() {
    const links = document.querySelectorAll('a');
    links.forEach(link => {
        link.addEventListener('mouseover', function(e) {
            // Clear any existing status text
            window.status = '';
            return true;
        });
        
        // Alternative method to prevent status bar changes
        link.onmouseover = link.onmouseout = function() {
            return true;
        };
    });
});

// Disable right-click
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
});

// Optional: Disable keyboard shortcuts (F12, Ctrl+Shift+I, etc.)
document.addEventListener('keydown', function(e) {
    // Disable F12
    if (e.key === 'F12') e.preventDefault();
    
    // Disable Ctrl+Shift+I (Chrome, Firefox)
    if (e.ctrlKey && e.shiftKey && e.key === 'I') e.preventDefault();
    
    // Disable Ctrl+Shift+J (Chrome)
    if (e.ctrlKey && e.shiftKey && e.key === 'J') e.preventDefault();
    
    // Disable Ctrl+U (View source)
    if (e.ctrlKey && e.key === 'u') e.preventDefault();
});
    </script>
</body>
</html>
